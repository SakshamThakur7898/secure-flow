<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SecureFlow — Access Denied</title>
<link rel="stylesheet" href="/css/styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
  <div class="centered-shell">
    <div class="access-denied-shell">
      <div class="access-denied-icon"><i data-lucide="shield-alert" style="width:30px;height:30px"></i></div>
      <h1>Access Denied</h1>
      <p class="text-muted mt-8">You do not have permission to access this page. This action requires
        Administrator privileges, and the server has verified your account does not have them.</p>
      <div class="row gap-10" style="justify-content:center; margin-top:22px;">
        <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>
        <a href="/" class="btn btn-secondary">Log Out</a>
      </div>
    </div>
  </div>
  <script>if (window.lucide) window.lucide.createIcons(); else document.addEventListener('DOMContentLoaded', () => window.lucide && window.lucide.createIcons());</script>
</body>
</html>
